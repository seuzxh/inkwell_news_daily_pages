<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inkwell 资讯</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1 class="site-title"><a href="index.html">Inkwell 资讯</a></h1>
    <p class="site-subtitle">每日精选 AI 科技、投研与市场动态</p>
    <nav class="site-nav">
      <a href="index.html" class="active">今日</a>
      <a href="archive.html">归档</a>
    </nav>
  </header>

  <main id="content">
    <!-- 内容由 JavaScript 动态加载 -->
  </main>

  <footer class="site-footer">
    <p>Powered by <a href="#" style="color: inherit;">Inkwell Archive</a></p>
  </footer>

  <script>
    // 资讯数据
    const newsData = {
  "2026-05-07": null,
  "2026-05-06_complete": null,
  "2026-05-05": null
};

    // 获取所有日期（按日期倒序）
    function getAllDates() {
      return Object.keys(newsData).sort().reverse();
    }

    // 获取最新日期
    function getLatestDate() {
      const dates = getAllDates();
      return dates.length > 0 ? dates[0] : null;
    }

    // 渲染单条资讯
    function renderNewsItem(item) {
      return `
        <li class="news-item">
          <h3 class="news-title">${item.title}</h3>
          <p class="news-summary">${item.summary}</p>
        </li>
      `;
    }

    // 渲染分类
    function renderCategory(title, items, className) {
      if (!items || items.length === 0) return '';
      return `
        <section class="category">
          <h2 class="category-title ${className}">${title}</h2>
          <ul class="news-list">
            ${items.map(renderNewsItem).join('')}
          </ul>
        </section>
      `;
    }

    // 渲染日期页面
    function renderDatePage(dateKey) {
      const data = newsData[dateKey];
      if (!data) {
        document.getElementById('content').innerHTML = `
          <div class="empty-state">
            <p>暂无资讯</p>
          </div>
        `;
        return;
      }

      document.getElementById('content').innerHTML = `
        <div class="date-header">
          <h2 class="date-title">${data.date}</h2>
          <p class="date-subtitle">${data.weekday}</p>
        </div>
        ${renderCategory('AI 科技', data.ai_tech, 'ai-tech')}
        ${renderCategory('投研', data.research, 'research')}
        ${renderCategory('市场动态', data.market, 'market')}
      `;
    }

    // 初始化首页
    const latestDate = getLatestDate();
    if (latestDate) {
      renderDatePage(latestDate);
      document.title = `${newsData[latestDate].date} - Inkwell 资讯`;
    } else {
      document.getElementById('content').innerHTML = `
        <div class="empty-state">
          <p>暂无资讯</p>
          <p style="font-size: 14px;">使用 add_news.py 添加新资讯</p>
        </div>
      `;
    }
  </script>
</body>
</html>
