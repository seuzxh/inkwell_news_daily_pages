    // 获取所有日期（按日期倒序）
    function getAllDates() {
      return Object.keys(newsData).sort().reverse();
    }

    // 获取最新日期
    function getLatestDate() {
      const dates = getAllDates();
      return dates.length > 0 ? dates[0] : null;
    }

    // 渲染单条资讯
    function renderNewsItem(item) {
      const titleHtml = item.link ? `<a href="${item.link}" target="_blank" rel="noopener" class="news-link">${item.title}</a>` : item.title;
      return `
        <li class="news-item">
          <h3 class="news-title">${titleHtml}</h3>
          <p class="news-summary">${item.summary}</p>
        </li>
      `;
    }

    // 渲染分类
    function renderCategory(title, items, className) {
      if (!items || items.length === 0) return '';
      return `
        <section class="category">
          <h2 class="category-title ${className}">${title}</h2>
          <ul class="news-list">
            ${items.map(renderNewsItem).join('')}
          </ul>
        </section>
      `;
    }

    // 渲染日期页面
    function renderDatePage(dateKey) {
      const data = newsData[dateKey];
      if (!data) {
        document.getElementById('content').innerHTML = `
          <div class="empty-state">
            <p>暂无资讯</p>
          </div>
        `;
        return;
      }

      document.getElementById('content').innerHTML = `
        <div class="date-header">
          <h2 class="date-title">${data.date}</h2>
          <p class="date-subtitle">${data.weekday}</p>
        </div>
        ${renderCategory('AI 科技', data.ai_tech, 'ai-tech')}
        ${renderCategory('投研', data.research, 'research')}
        ${renderCategory('市场动态', data.market, 'market')}
      `;
    }

    // 初始化首页
    const latestDate = getLatestDate();
    if (latestDate) {
      renderDatePage(latestDate);
      document.title = `${newsData[latestDate].date} - Inkwell 资讯`;
    } else {
      document.getElementById('content').innerHTML = `
        <div class="empty-state">
          <p>暂无资讯</p>
          <p style="font-size: 14px;">使用 add_news.py 添加新资讯</p>
        </div>
      `;
    }
  </script>
