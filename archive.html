<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>归档 - Inkwell 资讯</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1 class="site-title"><a href="index.html">Inkwell 资讯</a></h1>
    <p class="site-subtitle">每日精选 AI 科技、投研与市场动态</p>
    <nav class="site-nav">
      <a href="index.html">今日</a>
      <a href="archive.html" class="active">归档</a>
    </nav>
  </header>

  <main id="content">
    <!-- 内容由 JavaScript 动态加载 -->
  </main>

  <footer class="site-footer">
    <p>Powered by <a href="#" style="color: inherit;">Inkwell Archive</a></p>
  </footer>

  <script>
    // 资讯数据
    const newsData = {
  "2026-05-07": null,
  "2026-05-06_complete": null,
  "2026-05-05": null
};

    // 获取所有日期（按日期倒序）
    function getAllDates() {
      return Object.keys(newsData).sort().reverse();
    }

    // 渲染归档页
    function renderArchive() {
      const dates = getAllDates();
      
      if (dates.length === 0) {
        document.getElementById('content').innerHTML = `
          <div class="empty-state">
            <p>暂无归档</p>
          </div>
        `;
        return;
      }

      const archiveItems = dates.map(dateKey => {
        const data = newsData[dateKey];
        const totalNews = (data.ai_tech?.length || 0) + 
                         (data.research?.length || 0) + 
                         (data.market?.length || 0);
        return `
          <li class="archive-date">
            <a class="archive-date-link" href="date.html?date=${dateKey}">
              ${data.date} ${data.weekday}
            </a>
            <span style="color: #999; font-size: 14px; margin-left: 8px;">${totalNews} 条资讯</span>
          </li>
        `;
      }).join('');

      document.getElementById('content').innerHTML = `
        <h2 class="date-title" style="margin-bottom: 24px;">资讯归档</h2>
        <p style="color: #666; margin-bottom: 32px; font-size: 14px;">共 ${dates.length} 天资讯</p>
        <ul class="archive-list">
          ${archiveItems}
        </ul>
      `;
    }

    renderArchive();
  </script>
</body>
</html>
