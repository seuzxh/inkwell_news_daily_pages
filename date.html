<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>资讯 - Inkwell 资讯</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1 class="site-title"><a href="index.html">Inkwell 资讯</a></h1>
    <p class="site-subtitle">每日精选 AI 科技、投研与市场动态</p>
    <nav class="site-nav">
      <a href="index.html">今日</a>
      <a href="archive.html" class="active">归档</a>
    </nav>
  </header>

  <main id="content">
    <!-- 内容由 JavaScript 动态加载 -->
  </main>

  <footer class="site-footer">
    <p>Powered by <a href="#" style="color: inherit;">Inkwell Archive</a></p>
  </footer>

  <script>
    // 资讯数据
    const newsData = {
  "2026-05-07": null,
  "2026-05-06_complete": null,
  "2026-05-05": null
};
    const newsData = {
  "2026-05-07": null,
  "2026-05-06_complete": null,
  "2026-05-05": null
};

    // 获取 URL 参数
    function getUrlParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    // 渲染单条资讯
    function renderNewsItem(item) {
      return `
        <li class="news-item">
          <h3 class="news-title">${item.title}</h3>
          <p class="news-summary">${item.summary}</p>
        </li>
      `;
    }

    // 渲染分类
    function renderCategory(title, items, className) {
      if (!items || items.length === 0) return '';
      return `
        <section class="category">
          <h2 class="category-title ${className}">${title}</h2>
          <ul class="news-list">
            ${items.map(renderNewsItem).join('')}
          </ul>
        </section>
      `;
    }

    // 计算精选资讯数量
    function getFeaturedCount(data) {
      let count = 0;
      if (data.ai_tech) count += Math.min(data.ai_tech.length, 6);
      if (data.research) count += Math.min(data.research.length, 5);
      if (data.market) count += Math.min(data.market.length, 5);
      return count;
    }

    // 渲染日期页面
    function renderDatePage(dateKey) {
      const data = newsData[dateKey];
      if (!data) {
        document.getElementById('content').innerHTML = `
          <div class="empty-state">
            <p>该日期暂无资讯</p>
            <a href="archive.html" style="color: #0066cc;">返回归档</a>
          </div>
        `;
        document.title = '未找到 - Inkwell 资讯';
        return;
      }

      const featuredCount = getFeaturedCount(data);
      
      document.getElementById('content').innerHTML = `
        <div class="date-header">
          <h2 class="date-title">${data.date}</h2>
          <p class="date-subtitle">${data.weekday}</p>
        </div>
        ${renderCategory('AI 科技', data.ai_tech, 'ai-tech')}
        ${renderCategory('投研', data.research, 'research')}
        ${renderCategory('市场动态', data.market, 'market')}
        <div class="complete-link-wrapper">
          <a href="complete.html?date=${dateKey}" class="btn-complete">
            查看完整列表 <span class="complete-count"></span>
          </a>
        </div>
      `;
      document.title = `${data.date} - Inkwell 资讯`;
    }

    // 初始化
    const date = getUrlParam('date');
    if (date) {
      renderDatePage(date);
    } else {
      // 没有指定日期，跳转到首页
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
;
