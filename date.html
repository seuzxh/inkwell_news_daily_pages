<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>资讯 - Inkwell 资讯</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1 class="site-title"><a href="index.html">Inkwell 资讯</a></h1>
    <p class="site-subtitle">每日精选 AI 科技、投研与市场动态</p>
    <nav class="site-nav">
      <a href="index.html">今日</a>
      <a href="archive.html" class="active">归档</a>
    </nav>
  </header>

  <main id="content">
    <!-- 内容由 JavaScript 动态加载 -->
  </main>

  <footer class="site-footer">
    <p>Powered by <a href="#" style="color: inherit;">Inkwell Archive</a></p>
  </footer>

  <script>
    // 资讯数据
    const newsData = {
      "2026-05-05": {
        date: "2026年5月5日",
        weekday: "星期二",
        ai_tech: [
          { title: "OpenAI 发布 GPT-5，推理能力再创新高", summary: "新一代模型在复杂推理任务上超越人类专家平均水平，支持多模态实时理解。" },
          { title: "Anthropic 推出 Claude 4，企业级安全能力全面升级", summary: "新增企业知识库深度整合功能，隐私保护机制获得 SOC2 Type II 认证。" },
          { title: "谷歌发布 Gemini Ultra 2，聚焦端侧部署", summary: "专为移动设备优化的模型，可在手机端运行百亿参数规模。" }
        ],
        research: [
          { title: "斯坦福 AI 报告：AI 助手显著提升知识工作者效率", summary: "研究显示使用 AI 辅助的员工完成任务速度平均提升 40%，错误率下降 25%。" },
          { title: "MIT 发现大模型推理的Scaling Law新规律", summary: "论文指出模型表现不仅与参数量相关，训练数据多样性同样关键。" }
        ],
        market: [
          { title: "英伟达股价再创新高，市值突破 4 万亿美元", summary: "AI 芯片需求持续旺盛，数据中心业务季度营收同比翻倍。" },
          { title: "软银宣布千亿美元 AI 投资基金", summary: "孙正义称 AI 革命是继互联网后最大的投资机会。" }
        ]
      },
      "2026-05-04": {
        date: "2026年5月4日",
        weekday: "星期一",
        ai_tech: [
          { title: "Meta 开源 LLaMA 4，性能直逼 GPT-4", summary: "新版本支持 100 万 token 上下文，在多项基准测试中刷新纪录。" },
          { title: "苹果WWDC定档6月，Siri 将迎来重大升级", summary: "知情人士透露新版 Siri 将深度整合本地 AI 能力，保护用户隐私。" }
        ],
        research: [
          { title: "OpenAI 研究：AI 系统的校准问题仍需解决", summary: "论文指出当前大模型在不确定性估计上存在系统性偏差。" }
        ],
        market: [
          { title: "微软 Azure AI 收入同比增长 80%", summary: "企业 AI 需求强劲，Azure 成为微软增长最大驱动力。" },
          { title: "AI 创业公司融资回暖，Q1 全球融资超 200 亿美元", summary: "生成式 AI 应用层公司获投最多，基础设施赛道降温。" }
        ]
      },
      "2026-04-30": {
        date: "2026年4月30日",
        weekday: "星期四",
        ai_tech: [
          { title: "Stability AI 发布 Stable Diffusion 4", summary: "新一代图像生成模型支持更长描述词，图像质量显著提升。" }
        ],
        research: [
          { title: "图灵奖授予三位深度学习先驱", summary: "表彰他们在反向传播算法和卷积神经网络方面的开创性贡献。" }
        ],
        market: [
          { title: "亚马逊 AWS 推出定制 AI 芯片Trainium 3", summary: "自研芯片进一步降低训练成本，与英伟达形成竞争。" }
        ]
      }
    };

    // 获取 URL 参数
    function getUrlParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    // 渲染单条资讯
    function renderNewsItem(item) {
      return `
        <li class="news-item">
          <h3 class="news-title">${item.title}</h3>
          <p class="news-summary">${item.summary}</p>
        </li>
      `;
    }

    // 渲染分类
    function renderCategory(title, items, className) {
      if (!items || items.length === 0) return '';
      return `
        <section class="category">
          <h2 class="category-title ${className}">${title}</h2>
          <ul class="news-list">
            ${items.map(renderNewsItem).join('')}
          </ul>
        </section>
      `;
    }

    // 计算精选资讯数量
    function getFeaturedCount(data) {
      let count = 0;
      if (data.ai_tech) count += Math.min(data.ai_tech.length, 6);
      if (data.research) count += Math.min(data.research.length, 5);
      if (data.market) count += Math.min(data.market.length, 5);
      return count;
    }

    // 渲染日期页面
    function renderDatePage(dateKey) {
      const data = newsData[dateKey];
      if (!data) {
        document.getElementById('content').innerHTML = `
          <div class="empty-state">
            <p>该日期暂无资讯</p>
            <a href="archive.html" style="color: #0066cc;">返回归档</a>
          </div>
        `;
        document.title = '未找到 - Inkwell 资讯';
        return;
      }

      const featuredCount = getFeaturedCount(data);
      
      document.getElementById('content').innerHTML = `
        <div class="date-header">
          <h2 class="date-title">${data.date}</h2>
          <p class="date-subtitle">${data.weekday}</p>
        </div>
        ${renderCategory('AI 科技', data.ai_tech, 'ai-tech')}
        ${renderCategory('投研', data.research, 'research')}
        ${renderCategory('市场动态', data.market, 'market')}
        <div class="complete-link-wrapper">
          <a href="complete.html?date=${dateKey}" class="btn-complete">
            查看完整列表 <span class="complete-count"></span>
          </a>
        </div>
      `;
      document.title = `${data.date} - Inkwell 资讯`;
    }

    // 初始化
    const date = getUrlParam('date');
    if (date) {
      renderDatePage(date);
    } else {
      // 没有指定日期，跳转到首页
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
