        ai_tech: [

          { title: "Anthropic 推出 Claude 4，企业级安全能力全面升级", summary: "新增企业知识库深度整合功能，隐私保护机制获得 SOC2 Type II 认证。" },

          { title: "英伟达股价再创新高，市值突破 4 万亿美元", summary: "AI 芯片需求持续旺盛，数据中心业务季度营收同比翻倍。" },

        ]
      },
      "2026-05-04": {
        date: "2026年5月4日",
        weekday: "星期一",
        ai_tech: [
          { title: "Meta 开源 LLaMA 4，性能直逼 GPT-4", summary: "新版本支持 100 万 token 上下文，在多项基准测试中刷新纪录。" },
          { title: "苹果WWDC定档6月，Siri 将迎来重大升级", summary: "知情人士透露新版 Siri 将深度整合本地 AI 能力，保护用户隐私。" }
        ],

          { title: "OpenAI 研究：AI 系统的校准问题仍需解决", summary: "论文指出当前大模型在不确定性估计上存在系统性偏差。" }
        ],

        ]
      },
      "2026-04-30": {

        ],

          { title: "亚马逊 AWS 推出定制 AI 芯片Trainium 3", summary: "自研芯片进一步降低训练成本，与英伟达形成竞争。" }
        ]
      }
    };

    // 获取 URL 参数
    function getUrlParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    // 渲染单条资讯
    function renderNewsItem(item) {
      const titleHtml = item.link ? `<a href="${item.link}" target="_blank" rel="noopener" class="news-link">${item.title}</a>` : item.title;
      return `
        <li class="news-item">
          <h3 class="news-title">${titleHtml}</h3>
          <p class="news-summary">${item.summary}</p>
        </li>
      `;
    }

    // 渲染分类区块
    function renderCategorySection(title, items, categoryClass) {
      if (!items || items.length === 0) return '';
      const count = items.length;
      return `
        <section class="complete-category ${categoryClass}">
          <div class="complete-category-header">
            <h2 class="complete-category-title">${title}</h2>
            <span class="complete-category-count">${count} 条</span>
          </div>
          <ul class="news-list">
            ${items.map(renderNewsItem).join('')}
          </ul>
        </section>
      `;
    }

    // 渲染完整列表页面
    function renderCompletePage(dateKey) {
      const data = completeNewsData[dateKey];
      const featured = featuredNewsData[dateKey];
      
      if (!data) {
        document.getElementById('content').innerHTML = `
          <a href="date.html?date=${dateKey}" class="back-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            返回精选
          </a>
          <div class="empty-state">
            <p>该日期暂无完整资讯</p>
            <a href="archive.html" style="color: #0066cc;">返回归档</a>
          </div>
        `;
        document.title = '未找到 - Inkwell 资讯';
        return;
      }

      // 计算各分类数量
      const techCount = data.tech ? data.tech.length : 0;
      const productCount = data.product ? data.product.length : 0;
      const financeCount = data.finance ? data.finance.length : 0;
      const otherCount = data.other ? data.other.length : 0;
      const totalCount = techCount + productCount + financeCount + otherCount;

      document.getElementById('content').innerHTML = `
        <a href="date.html?date=${dateKey}" class="back-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          返回精选
        </a>
        
        <div class="date-header">
          <h2 class="date-title">${data.date} - 完整列表</h2>
          <p class="date-subtitle">${data.weekday} · 当日全部资讯</p>
        </div>
        
        <div class="stats-bar">
          <span class="stats-total">共 ${totalCount} 条资讯</span>
          <div class="stats-categories">
            <span class="stats-category tech">科技<span class="count">${techCount}</span></span>
            <span class="stats-category product">产品<span class="count">${productCount}</span></span>
            <span class="stats-category finance">金融<span class="count">${financeCount}</span></span>
            <span class="stats-category other">其他<span class="count">${otherCount}</span></span>
          </div>
        </div>
        
        ${renderCategorySection('科技', data.tech, 'tech')}
        ${renderCategorySection('产品', data.product, 'product')}
        ${renderCategorySection('金融', data.finance, 'finance')}
        ${renderCategorySection('其他', data.other, 'other')}
      `;
      
      document.title = `${data.date} 完整列表 - Inkwell 资讯`;
    }

    // 初始化
    const date = getUrlParam('date');
    if (date) {
      renderCompletePage(date);
    } else {
      // 没有指定日期，跳转到归档页
      window.location.href = 'archive.html';
    }
  </script>
</body>
