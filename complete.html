    // 获取 URL 参数
    function getUrlParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    // 渲染单条资讯
    function renderNewsItem(item) {
      const titleHtml = item.link ? `<a href="${item.link}" target="_blank" rel="noopener" class="news-link">${item.title}</a>` : item.title;
      return `
        <li class="news-item">
          <h3 class="news-title">${titleHtml}</h3>
          <p class="news-summary">${item.summary}</p>
        </li>
      `;
    }

    // 渲染分类区块
    function renderCategorySection(title, items, categoryClass) {
      if (!items || items.length === 0) return '';
      const count = items.length;
      return `
        <section class="complete-category ${categoryClass}">
          <div class="complete-category-header">
            <h2 class="complete-category-title">${title}</h2>
            <span class="complete-category-count">${count} 条</span>
          </div>
          <ul class="news-list">
            ${items.map(renderNewsItem).join('')}
          </ul>
        </section>
      `;
    }

    // 渲染完整列表页面

      const data = completeNewsData[dateKey];
      const featured = featuredNewsData[dateKey];
